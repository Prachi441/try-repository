<!DOCTYPE html>
<html>
<head>
    <title>Car Racing Game</title>
    <style>
        body {
            margin: 0;
            background: #111;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
        }

        h1 {
            padding: 10px;
        }

        #gameArea {
            position: relative;
            width: 300px;
            height: 500px;
            margin: auto;
            background: #333;
            overflow: hidden;
            border: 4px solid white;
        }

        .car {
            position: absolute;
            width: 50px;
            height: 100px;
            background: red;
            bottom: 10px;
            left: 125px;
            border-radius: 10px;
        }

        .enemy {
            position: absolute;
            width: 50px;
            height: 100px;
            background: yellow;
            top: -120px;
            border-radius: 10px;
        }

        #score {
            margin-top: 10px;
            font-size: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>🚗 Car Racing Game</h1>
<button onclick="startGame()">Start Game</button>
<div id="score">Score: 0</div>

<div id="gameArea">
    <div class="car" id="playerCar"></div>
</div>

<script>
    let playerCar = document.getElementById("playerCar");
    let gameArea = document.getElementById("gameArea");
    let scoreDisplay = document.getElementById("score");

    let playerX = 125;
    let enemy;
    let enemyY = -120;
    let enemyX;
    let score = 0;
    let gameInterval;

    document.addEventListener("keydown", function(e) {
        if (e.key === "ArrowLeft" && playerX > 0) {
            playerX -= 20;
        }
        if (e.key === "ArrowRight" && playerX < 250) {
            playerX += 20;
        }
        playerCar.style.left = playerX + "px";
    });

    function startGame() {
        score = 0;
        enemyY = -120;
        playerX = 125;
        playerCar.style.left = playerX + "px";

        if (enemy) enemy.remove();

        enemy = document.createElement("div");
        enemy.classList.add("enemy");
        gameArea.appendChild(enemy);

        enemyX = Math.floor(Math.random() * 250);
        enemy.style.left = enemyX + "px";

        gameInterval = setInterval(updateGame, 20);
    }

    function updateGame() {
        enemyY += 5;
        enemy.style.top = enemyY + "px";

        score++;
        scoreDisplay.innerHTML = "Score: " + score;

        // Collision Detection
        if (
            enemyY > 380 &&
            enemyX < playerX + 50 &&
            enemyX + 50 > playerX
        ) {
            clearInterval(gameInterval);
            alert("💥 Game Over! Your Score: " + score);
        }

        // Reset enemy
        if (enemyY > 500) {
            enemyY = -120;
            enemyX = Math.floor(Math.random() * 250);
            enemy.style.left = enemyX + "px";
        }
    }
</script>

</body>
</html>
